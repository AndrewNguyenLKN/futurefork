[project]
name = "futurefork"
version = "0.0.1"
description = "FutureFork: rehearse future changes on isolated code candidates."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Candidates under examples/ are self-contained projects with their own `tests/`.
norecursedirs = ["examples", ".venv", "artifacts", "node_modules"]
